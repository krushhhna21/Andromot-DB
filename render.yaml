services:
  # FastAPI Web Service with embedded asynchronous queue worker (100% Free Tier on Render)
  - type: web
    name: andromot-api
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn andromot.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: andromot
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_JSON
        value: true
      - key: DATABASE_URL
        sync: false
      - key: DEVICE_CREDENTIAL_PEPPER
        sync: false
      - key: TELEGRAM_ENABLED
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GROQ_ENABLED
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
